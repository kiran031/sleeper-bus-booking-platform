spring.application.name=SleeperBookingPlatform
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/sleeperbookingplatform
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${ACCESS_TOKEN}
refresh.secret=${REFRESH_TOKEN}

booking.pricing.gst-rate=0.05
booking.pricing.convenience-fee=20.00

razorpay.key-id = ${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true